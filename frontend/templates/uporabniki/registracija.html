{% extends "base.html" %}
{% block naslov %}Registracija{% endblock %}
{% block vsebina %}
<div class="kartica ozko">
  <h1>Registracija</h1>
  <form method="post">
    {% csrf_token %}
    {% include "_obrazec.html" %}
    <button type="submit" class="glavni">Ustvari račun</button>
  </form>
  <p class="pod">Že imaš račun? <a href="{% url 'prijava' %}">Prijava</a></p>
</div>
{% endblock %}
